<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Trade Monitor</title>
    <style>
        /* Same palette as dashboard.html, so the login reads as part of it. */
        :root {
            --bg-gradient: linear-gradient(135deg, #5b8def 0%, #6677d8 45%, #8c75c4 100%);
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --danger: #EF4444;
            --tint-danger: #FEF2F2;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg-gradient);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 14px;
            color: var(--text-primary);
        }
        .card {
            background: var(--card-bg);
            width: 100%; max-width: 360px;
            padding: 28px 28px 24px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }
        h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
        .sub { margin: 0 0 20px; color: var(--text-muted); font-size: 13px; }
        label {
            display: block; margin: 0 0 6px;
            font-size: 11px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        input {
            width: 100%; padding: 9px 11px; margin: 0 0 14px;
            font-size: 14px; color: var(--text-primary);
            border: 1px solid var(--card-border); border-radius: 6px;
        }
        input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }
        button {
            width: 100%; padding: 10px; margin-top: 4px;
            font-size: 14px; font-weight: 600; color: white;
            background: var(--primary); border: none; border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: 0.6; cursor: default; }
        .error {
            display: none; margin: 0 0 14px; padding: 8px 10px;
            font-size: 13px; color: #991B1B;
            background: var(--tint-danger); border-radius: 6px;
        }
    </style>
</head>
<body>
<form class="card" id="loginForm" autocomplete="on">
    <h1>Trade Monitor</h1>
    <p class="sub">Sign in to continue</p>
    <div class="error" id="loginError" role="alert"></div>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Sign in</button>
</form>

<script id="login-config" type="application/json">
{ "next": {{ next_url | tojson }} }
</script>
<script>
const _NEXT = JSON.parse(document.getElementById("login-config").textContent).next || "/";

function showError(msg) {
    const el = document.getElementById("loginError");
    el.innerText = msg;
    el.style.display = msg ? "block" : "none";
}

document.getElementById("loginForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    showError("");
    try {
        // Relative URL: the cookie the server sets must belong to the origin
        // this page was loaded from, which is the one the dashboard calls.
        const resp = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
            }),
        });
        let data = null;
        try { data = await resp.json(); } catch (_) { /* non-JSON error page */ }
        if (resp.ok && Array.isArray(data) && data[0]) {
            window.location.replace(_NEXT);
            return;
        }
        showError(Array.isArray(data) && data[1] ? data[1]
                  : `Sign-in failed (HTTP ${resp.status}).`);
    } catch (e) {
        showError("Could not reach the server.");
    }
    document.getElementById("password").value = "";
    btn.disabled = false;
});
</script>
</body>
</html>
